<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <circle cx="32" cy="32" r="30" fill="#c0392b"/>
  <!-- Brows: bold, close to eyes -->
  <path d="M15 27 Q22 19 29 25" stroke="white" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M35 25 Q42 19 49 27" stroke="white" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <!-- Eyes: same size, well spaced -->
  <circle cx="24" cy="34" r="6.5" fill="white"/>
  <circle cx="40" cy="34" r="6.5" fill="white"/>
  <!-- Right eye filled blue -->
  <circle cx="40" cy="34" r="4.5" fill="#1a6bb5"/>
  <circle cx="42" cy="32" r="1.4" fill="white"/>
</svg>
